<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Сперанский AI</title>

<link rel="preconnect" href="https://homework-bot-6h3b.onrender.com" crossorigin>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
      crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
        crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
        crossorigin="anonymous"></script>
<script defer src="app.js?v=20260917a"></script>

<link rel="stylesheet" href="style.css?v=20260915a">
</head>
<body>

<div id="boot" class="boot">
  <svg class="boot-spark" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z"/>
  </svg>
  <div class="boot-text">Сперанский AI открывается…</div>
</div>

<div id="fatal" class="fatal" hidden>
  <div class="fatal-emoji">🤔</div>
  <h1>Не открылось</h1>
  <p id="fatal-text">Что-то пошло не так.</p>
  <button id="fatal-retry" class="icon-btn fatal-retry">🔄 Повторить</button>
</div>

<header id="head" hidden>
  <div class="head-row">
    <button id="btn-chats" class="icon-btn" title="Чаты">☰</button>
    <div class="head-title" id="head-title">Новый чат</div>
    <button id="btn-model" class="chip model-chip" title="Модель">model</button>
    <button id="btn-new" class="icon-btn" title="Новый чат">✚</button>
  </div>
</header>

<div id="warn" class="warn" hidden></div>

<main id="messages" class="messages" hidden aria-live="polite"></main>

<div id="empty" class="empty" hidden>
  <svg class="empty-spark" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z"/>
  </svg>
  <h2 id="empty-title">Начнём?</h2>
  <p id="empty-text">Выбери модель — чат создастся сразу.<br>
     Или просто напиши вопрос / прикрепи фото скрепкой.</p>
  <button id="btn-start-cta" class="cta-btn">✨ Выбрать модель и начать</button>
</div>

<div id="attach-preview" class="attach-preview" hidden>
  <img id="attach-thumb" alt="">
  <button id="attach-remove" class="icon-btn" title="Убрать фото" aria-label="Убрать фото"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<footer id="composer" class="composer" hidden>
  <button id="btn-mic" class="icon-btn attach-btn" title="Голосовое сообщение" aria-label="Голосовое сообщение">
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></svg>
  </button>
  <button id="btn-attach" class="icon-btn attach-btn" title="Фото задания" aria-label="Фото задания">
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M20 11.5 12.3 19a5 5 0 0 1-7-7l8.5-8.4a3.3 3.3 0 0 1 4.7 4.7L9.4 15.8a1.7 1.7 0 0 1-2.4-2.4l7.8-7.7"/></svg>
  </button>
  <input id="file-input" type="file" accept="image/*" hidden>
  <textarea id="input" rows="1" placeholder="Сообщение…"></textarea>
  <button id="btn-send" class="send-btn" title="Отправить" aria-label="Отправить"><span id="send-ico"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M3.4 20.6 21 12 3.4 3.4l2.4 7.2L15 12l-9.2 1.4z"/></svg></span></button>
</footer>

<!-- оверлей: список чатов -->
<div id="chats-sheet" class="sheet" hidden>
  <div class="sheet-back"></div>
  <div class="sheet-body">
    <div class="sheet-head">
      <span>Чаты</span>
      <span class="sheet-head-actions">
        <button id="btn-wipe" class="icon-btn" title="Удалить всю мою историю">🗑</button>
        <button class="icon-btn sheet-close" aria-label="Закрыть"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </span>
    </div>
    <div id="chats-list" class="chats-list"></div>
  </div>
</div>

<!-- оверлей: выбор модели -->
<div id="model-sheet" class="sheet" hidden>
  <div class="sheet-back"></div>
  <div class="sheet-body">
    <div class="sheet-head">
      <span>Модель</span>
      <button class="icon-btn sheet-close" aria-label="Закрыть"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="models-list" class="models-list"></div>
  </div>
</div>

<script>
window.__NEED_APP_V = '20260917a';
window.addEventListener('load', function () {
  if (window.__APP_V !== window.__NEED_APP_V) {
    var k = 'bust-' + window.__NEED_APP_V;
    if (!sessionStorage.getItem(k)) {
      sessionStorage.setItem(k, '1');
      var u = new URL(location.href);
      u.searchParams.set('cb', Date.now());
      location.replace(u.toString());
    }
  }
});
</script>
</body>
</html>
