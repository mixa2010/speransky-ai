<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Сперанский AI</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
      crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
        crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
        crossorigin="anonymous"></script>
<script defer src="app.js?v=20260914b"></script>

<link rel="stylesheet" href="style.css?v=20260914b">
</head>
<body>

<div id="boot" class="boot">
  <div class="spinner"></div>
  <div class="boot-text">Открываю приложение…</div>
</div>

<div id="fatal" class="fatal" hidden>
  <div class="fatal-emoji">🤔</div>
  <h1>Не открылось</h1>
  <p id="fatal-text">Что-то пошло не так.</p>
  <button id="fatal-retry" class="icon-btn fatal-retry">🔄 Повторить</button>
</div>

<header id="head" hidden>
  <div class="head-row">
    <button id="btn-chats" class="icon-btn" title="Чаты">☰</button>
    <div class="head-title" id="head-title">Новый чат</div>
    <button id="btn-model" class="chip model-chip" title="Модель">model</button>
    <button id="btn-new" class="icon-btn" title="Новый чат">✚</button>
  </div>
</header>

<div id="warn" class="warn" hidden></div>

<main id="messages" class="messages" hidden></main>

<div id="empty" class="empty" hidden>
  <div class="empty-emoji"></div>
  <p>Напиши первый вопрос — я отвечу здесь же.<br>
     Модель можно сменить кнопкой сверху.</p>
</div>

<footer id="composer" class="composer" hidden>
  <textarea id="input" rows="1" placeholder="Сообщение…"></textarea>
  <button id="btn-send" class="send-btn" title="Отправить">➤</button>
</footer>

<!-- оверлей: список чатов -->
<div id="chats-sheet" class="sheet" hidden>
  <div class="sheet-back"></div>
  <div class="sheet-body">
    <div class="sheet-head">
      <span>Чаты</span>
      <span class="sheet-head-actions">
        <button id="btn-wipe" class="icon-btn" title="Удалить всю мою историю">🗑</button>
        <button class="icon-btn sheet-close">✕</button>
      </span>
    </div>
    <div id="chats-list" class="chats-list"></div>
  </div>
</div>

<!-- оверлей: выбор модели -->
<div id="model-sheet" class="sheet" hidden>
  <div class="sheet-back"></div>
  <div class="sheet-body">
    <div class="sheet-head">
      <span>Модель</span>
      <button class="icon-btn sheet-close">✕</button>
    </div>
    <div id="models-list" class="models-list"></div>
  </div>
</div>

</body>
</html>
