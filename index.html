<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Сперанский AI — решение</title>

<!-- Telegram Web App SDK (нужен, чтобы работать внутри Telegram как Mini App) -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- KaTeX: настоящий рендер формул. Если CDN недоступен — страница не сломается,
     включится запасной режим (см. app.js). -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
      crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
        crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
        crossorigin="anonymous"></script>
<script defer src="app.js"></script>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="boot" class="boot">
  <div class="spinner"></div>
  <div class="boot-text">Загружаю решение…</div>
</div>

<div id="fatal" class="fatal" hidden>
  <div class="fatal-emoji">🤔</div>
  <h1>Решение не найдено</h1>
  <p id="fatal-text">Ссылка устарела или ответ ещё не готов.</p>
  <p class="fatal-hint">Вернись в чат с ботом и нажми кнопку «📱 Красиво» ещё раз —
     бот пришлёт свежую ссылку.</p>
</div>

<main id="view" hidden>
  <header id="head">
    <div class="head-row">
      <div class="head-title" id="head-title">Решение</div>
      <div class="head-actions">
        <button id="btn-font" class="icon-btn" title="Размер текста">A±</button>
        <button id="btn-copy" class="icon-btn" title="Скопировать текст">📋</button>
      </div>
    </div>
    <div class="head-meta" id="head-meta"></div>
  </header>

  <div id="warn" class="warn" hidden></div>

  <article id="content" class="content"></article>

  <nav id="pager" class="pager" hidden></nav>

  <footer class="foot">
    <span>Сперанский AI · Mini App</span>
  </footer>
</main>

</body>
</html>
